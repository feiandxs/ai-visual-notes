*{box-sizing:border-box}

.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}

.lang button[aria-pressed="true"]{background:var(--p-soft);color:var(--p);font-weight:600}
.hero{padding:24px 0 12px}
.hero .kicker{color:var(--p);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-family:var(--mono);font-size:clamp(28px,6vw,46px);margin:8px 0 12px;overflow-wrap:anywhere}
.hero .sub{color:var(--muted);font-size:clamp(15px,2.2vw,18px);max-width:680px}
.grp{margin-top:36px}
.grp h2{font-size:clamp(18px,3vw,22px);display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp h2 .c{font-family:var(--mono);font-size:12px;color:var(--p);background:var(--p-soft);border-radius:6px;padding:2px 8px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}

@media (min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;min-width:0;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--p);outline:none}
.card h3{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.card .src{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.card .desc{font-size:14px;color:var(--text);opacity:.88;overflow-wrap:anywhere}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer a{color:var(--p)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

der pressure.","culture/ancestors-decision-anthropology/"],["Computers in Sci-Fi Movies: What Was Behind the Screen, and What Changed Because of It","Compiled in this repo; references: ASC, Propstore, BFI Screenonline, NASM (Ceruzzi), PCMag, Yanko Design, Wikipedia and others","From Alien's junk-built panels and wireframe terrain to Brazil, Pip-Boy, HAL 9000, Minority Report, LCARS, digital rain, WarGames and Tron: which were real machines, which were props, and how film and reality influenced each other; more than ten interactive demos.","culture/sci-fi-movie-computers/"]]},{"name":"Society","items":[["After Two-Thirds Agree to Install an Elevator, Is It Too Late to Stop It?","Zhihu answerer (name not archived); supplemented with Civil Code Art. 278 and the SPC's 2023 elevator retrofit cases","A Zhihu playbook for stalling an elevator retrofit, checked step by step against China's Civil Code voting thresholds, city rules and court cases, with a vote calculator and cost-sharing tool.","society/elevator-installation-two-thirds-consent/"]]},{"name":"Design","items":[["What Font Do Calculators Use? Segment Display Fonts","oooooohmygosh, Zhihu Daily (upgraded from 微梨's \"Let's Play with Segment Fonts\")","From Nixie tubes to 7-, 9-, 16- and 22-segment displays: interactive displays explain the BEGHILOSZ puzzle, pager-speak and the art of segment fonts.","design/segment-display-fonts/"],["I Am Sorry, but Everyone Is Getting Syntax Highlighting Wrong","Nikita Prokopov (tonsky), tonsky.me (2025-10-15)","Syntax highlighting is a scanning tool, not Christmas lights: a timed lookup race, a four-color budget, what deserves color, bright comments, light-theme pitfalls, and stripping a theme down step by step.","design/syntax-highlighting-wrong/"]]},{"name":"Design · GUI Design History","items":[["Mac Visual History (1): From Macintosh to Mac OS","陈子木, sspai (2020-05-19, first published on uisdc)","An era slider redraws the Classic Mac desktop from System 1 to Mac OS 9 as wireframes, with a naming timeline, the 512×342 pixel budget, MFS vs HFS folders, font smoothing and a side-by-side control comparison.","design/gui-history/mac-visual-history-1-macintosh-to-mac-os/"],["Mac Visual History (2): The Failed Mac Operating Systems of the 1990s","陈子木, sspai (2020-05-27; first published on uisdc)","Pink/Taligent, Star Trek and Copland fail one after another before BeOS and NeXTSTEP face off: a clickable lineage map, Pink's headcount bloat curve and wireframe UI comparisons.","design/gui-history/mac-visual-history-2-failed-90s-mac-os/"],["Mac Visual History vol.2.5: Shunji Yamanaka's DrawingBoard","陈子木, sspai (2024-02-07)","The sketch-style Mac GUI industrial designer Shunji Yamanaka pitched to Apple around 1994: its visual grammar, concept vs. shipped theme, and the four Mac OS 8.5 beta themes compared.","design/gui-history/mac-visual-history-2-5-yamanaka-drawingboard/"],["Mac Visual History (3): Aqua and the Water-Reborn Look of Mac OS X","陈子木, sspai (2020-06-10; first published on uisdc)","From grey bevelled 90s GUIs through Rhapsody and the iMac G3 to Aqua, with side-by-side window wireframes, a column-view demo and a tunable gel-button lab.","design/gui-history/mac-visual-history-3-aqua-mac-os-x/"],["Windows Design History 01: From Awkward to Mature (Windows 1.0 – 95)","SUNTRISE, sspai (2024-05-06)","Tiled vs overlapping windows, Susan Kare's icons, 3D bevels, TrueType, and how usability testing produced the Start menu and taskbar.","design/gui-history/windows-design-history-1-from-1-0-to-95/"],["Windows Design History 02: Project Neptune, the Search Behind the \"Stable\" Surface","SUNTRISE, sspai (2024-05-13)","From the Windows 98 Desktop Update to RedShark and Neptune's Activity Centers: Microsoft's unfinished attempt to replace desktop and windows with task-centered pages.","design/gui-history/windows-design-history-2-neptune/"],["Windows Design History 03: Windows XP, From Mechanical to Natural","SUNTRISE, sspai","Win95 vs Luna wireframes, a 3D 'mascara' slider, decoy themes and Luna color schemes, Bliss color picking, the waving-flag logo and Fitts' law at the Start button.","design/gui-history/windows-design-history-3-windows-xp/"],["Windows 1.0 to 3.11: How the First Decade of Windows UI Evolved","Dmitrii Eliuseev, UX Collective (2021-03-20) / Chinese translation by uisdc.com","Revisiting Windows 1.01 to 3.11 in an emulator: tiled vs overlapping windows, DOS vs Windows programs, a 1200 bit/s modem, 8.3 filenames, TrueType scaling and a Visual Basic 1.0 event demo.","design/gui-history/windows-35-years-ui-evolution/"],["Windows 98's User Onboarding","Benjamin Brandall, Usersnap blog (2016-09-27) / Chinese translation by uisdc.com","Click through a Welcome to Windows 98 re-enactment: progressive profiling, the Recycle Bin empty state, Typical setup, practice exercises and consistency.","design/gui-history/windows-98-onboarding/"],["Apple Lisa: The Buried GUI Pioneer","YellowColr, sspai (2025-04-28)","Lisa at 40: from 'Do It' to OK, modal vs modeless editing, Twenty Questions vs icons and folders, document-centric stationery, Lisa vs Macintosh specs and price, and the 1989 landfill burial.","design/gui-history/apple-lisa-forgotten-gui-pioneer/"],["Ten Years On, I Still Miss You: The People and Ideas Behind Palm webOS","陈子木, sspai (2021-08-19)","A letter to webOS made interactive: gesture area, flick-to-close cards, bottom notifications, Touchstone and Touch2Share, and where the team went next.","design/gui-history/webos-ten-years-later/"]]},{"name":"Design · Typography","items":[["Five Myths About Grid Systems in Chinese Typesetting","Eric Q. Liu, 钱争予, The Type (2020-01-28)","Live Chinese text and CSS demos of the character-cell grid, sizing the text block before margins, counting in characters and lines, and the trade-offs of strict grid alignment.","design/typography/chinese-typesetting-grid-five-myths/"]]}]};
