*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}

a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}

.top{display:flex;justify-content:flex-end;padding-top:14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.lang button{border:0;background:none;cursor:pointer;font:inherit;font-size:13px;padding:6px 14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--p-soft);color:var(--p);font-weight:600}
.hero{padding:24px 0 12px}
.hero .kicker{color:var(--p);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-family:var(--mono);font-size:clamp(28px,6vw,46px);margin:8px 0 12px;overflow-wrap:anywhere}
.hero .sub{color:var(--muted);font-size:clamp(15px,2.2vw,18px);max-width:680px}
.grp{margin-top:36px}
.grp h2{font-size:clamp(18px,3vw,22px);display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp h2 .c{font-family:var(--mono);font-size:12px;color:var(--p);background:var(--p-soft);border-radius:6px;padding:2px 8px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}

@media (min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;min-width:0;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--p);outline:none}
.card h3{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.card .src{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.card .desc{font-size:14px;color:var(--text);opacity:.88;overflow-wrap:anywhere}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer a{color:var(--p)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

    s.appendChild(gr);m.appendChild(s);
  });
  document.getElementById('sub').textContent=T[l].sub;
  document.getElementById('foot').textContent=T[l].foot;
  document.documentElement.lang=T[l].lang;
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false')});
}
function init(){
  var l=null;
  try{l=localStorage.getItem('avn-lang')}catch(e){}
  if(l!=='zh'&&l!=='en')l=/^zh/i.test(navigator.language||'')?'zh':'en';
  render(l);
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){
    try{localStorage.setItem('avn-lang',b.dataset.l)}catch(e){}
    render(b.dataset.l);
  })});
}
init();
</script>
